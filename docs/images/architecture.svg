<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>System architecture: closed guidance loop with an outer evolutionary loop</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7d90a5"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  </defs>
  <rect width="1000" height="430" rx="10" fill="#0b1119"/>

  <rect x="14" y="14" width="972" height="262" rx="8" fill="none" stroke="#26384a" stroke-dasharray="5 5"/>
  <text x="28" y="36" fill="#7d90a5" font-size="12" letter-spacing="1.4" font-weight="600">INNER LOOP · 50 Hz GUIDANCE, 100 Hz PHYSICS (one episode, up to 40 s)</text>

  <rect x="690" y="40" width="280" height="26" rx="6" fill="#0f1722" stroke="#f59e0b"/>
  <text x="830" y="57" fill="#f59e0b" font-size="11" text-anchor="middle">disturbances: wind · turbulence · impulse · thrust loss</text>
  <path d="M830 66V78" stroke="#f59e0b" stroke-width="2" marker-end="url(#ao)"/>

  <g font-size="13" fill="#e8f1fa" text-anchor="middle">
    <rect x="30" y="80" width="150" height="110" rx="8" fill="#0f1722" stroke="#26384a"/>
    <text x="105" y="106" font-weight="700">Sensing</text>
    <text x="105" y="128" font-size="11" fill="#9fb2c4">10 normalised inputs</text>
    <text x="105" y="145" font-size="11" fill="#9fb2c4">Δx, √Δy, vx, vy, θ, ω,</text>
    <text x="105" y="160" font-size="11" fill="#9fb2c4">fuel, leg L/R, F/Fmax</text>
    <text x="105" y="178" font-size="11" fill="#f59e0b">+ optional sensor noise</text>

    <rect x="230" y="80" width="190" height="110" rx="8" fill="#0f1722" stroke="#22d3ee"/>
    <text x="325" y="106" font-weight="700">Neural controller</text>
    <text x="325" y="128" font-size="11" fill="#9fb2c4">MLP 10 → 16 → 12 → 2 (tanh)</text>
    <text x="325" y="145" font-size="11" fill="#9fb2c4">406 weights = 1 genome</text>
    <text x="325" y="168" font-size="11" fill="#22d3ee">throttle ∈ [0,1]</text>
    <text x="325" y="182" font-size="11" fill="#22d3ee">pitch command ∈ [−1,1]</text>

    <rect x="470" y="80" width="170" height="110" rx="8" fill="#0f1722" stroke="#26384a"/>
    <text x="555" y="106" font-weight="700">Actuators</text>
    <text x="555" y="128" font-size="11" fill="#9fb2c4">main engine, lag 50 ms</text>
    <text x="555" y="145" font-size="11" fill="#9fb2c4">gimbal ±8°, lag 80 ms</text>
    <text x="555" y="162" font-size="11" fill="#9fb2c4">cold-gas RCS couple</text>
    <text x="555" y="179" font-size="11" fill="#9fb2c4">zero-order hold</text>

    <rect x="690" y="80" width="280" height="110" rx="8" fill="#0f1722" stroke="#26384a"/>
    <text x="830" y="106" font-weight="700">Plant · 3-DoF rigid body · RK4</text>
    <text x="830" y="128" font-size="11" fill="#9fb2c4">variable mass and inertia, gimbal torque</text>
    <text x="830" y="145" font-size="11" fill="#9fb2c4">quadratic drag in wind, exponential atmosphere</text>
    <text x="830" y="162" font-size="11" fill="#9fb2c4">spring-damper legs, Coulomb friction</text>
    <text x="830" y="179" font-size="11" fill="#9fb2c4">raised platform with side walls, Δt = 10 ms</text>
  </g>

  <g stroke-width="2" fill="none">
    <path d="M180 135H228" stroke="#22d3ee" marker-end="url(#ac)"/>
    <path d="M420 135H468" stroke="#22d3ee" marker-end="url(#ac)"/>
    <path d="M640 135H688" stroke="#7d90a5" marker-end="url(#a)"/>
    <path d="M830 192V232H105V192" stroke="#7d90a5" marker-end="url(#a)"/>
  </g>
  <text x="820" y="224" fill="#7d90a5" font-size="11" text-anchor="end">measured state fed back (closed loop)</text>

  <rect x="14" y="296" width="972" height="120" rx="8" fill="none" stroke="#26384a" stroke-dasharray="5 5"/>
  <text x="972" y="318" text-anchor="end" fill="#7d90a5" font-size="12" letter-spacing="1.4" font-weight="600">OUTER LOOP · NEUROEVOLUTION (one generation = 40 brains flying one shared scenario)</text>

  <g font-size="13" fill="#e8f1fa" text-anchor="middle">
    <rect x="30" y="336" width="220" height="64" rx="8" fill="#0f1722" stroke="#26384a"/>
    <text x="140" y="362" font-weight="700">Fitness</text>
    <text x="140" y="381" font-size="11" fill="#9fb2c4">LQR-style cost + terminal reward</text>
    <rect x="290" y="336" width="190" height="64" rx="8" fill="#0f1722" stroke="#26384a"/>
    <text x="385" y="362" font-weight="700">Selection</text>
    <text x="385" y="381" font-size="11" fill="#9fb2c4">4 elites · tournament, k = 5</text>
    <rect x="520" y="336" width="250" height="64" rx="8" fill="#0f1722" stroke="#26384a"/>
    <text x="645" y="362" font-weight="700">Variation</text>
    <text x="645" y="381" font-size="11" fill="#9fb2c4">SBX crossover · adaptive Gaussian mutation</text>
    <rect x="810" y="336" width="160" height="64" rx="8" fill="#0f1722" stroke="#34d399"/>
    <text x="890" y="362" font-weight="700">Next generation</text>
    <text x="890" y="381" font-size="11" fill="#9fb2c4">40 new genomes</text>
  </g>
  <g stroke="#7d90a5" stroke-width="2" fill="none">
    <path d="M250 368H288" marker-end="url(#a)"/>
    <path d="M480 368H518" marker-end="url(#a)"/>
    <path d="M770 368H808" marker-end="url(#a)"/>
    <path d="M140 232V334" stroke-dasharray="6 4" marker-end="url(#a)"/>
  </g>
  <text x="130" y="272" fill="#7d90a5" font-size="11" text-anchor="end">episode trace → cost</text>
  <path d="M970 368H982V286H325V192" stroke="#34d399" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="640" y="280" fill="#34d399" font-size="11" text-anchor="middle">new genome weights are loaded into the controller</text>
</svg>
